<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        overflow-x: clip;
      }
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #ffffff;
        overflow-x: clip;
      }
      .banner {
        display: block;
        width: 38vw;
        height: auto;
        position: relative;
        z-index: 1;
      }
      .image-container {
        position: relative;
        width: 38vw;
        margin-top: -12vh;
      }
      @media (max-width: 768px) {
        .banner {
          width: 100vw;
        }
        .image-container {
          width: 100vw;
          margin-top: -6vh;
        }
      }
      .image-container img {
        width: 100%;
        height: auto;
        display: block;
      }
      .image-container img.hover {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: auto;
        opacity: 0;
        transition: opacity 0.0s ease;
        pointer-events: none;
      }
      .image-container img.hover.active {
        opacity: 1;
      }
      .hover-zone {
        position: absolute;
        cursor: pointer;
      }
      .zone1 { top: 34.0%; left: 26.0%; width: 25.0%; height: 19.7%; }
      .zone2 { top: 34.0%; left: 51.0%; width: 22.0%; height: 19.7%; }
      .zone3 { top: 53.7%; left: 26.0%; width: 25.0%; height: 19.7%; }
      .zone4 { top: 53.7%; left: 51.0%; width: 22.0%; height: 19.7%; }
      .zone5 { top: 73.3%; left: 26.0%; width: 25.0%; height: 19.7%; }
      .zone6 { top: 73.3%; left: 51.0%; width: 22.0%; height: 19.7%; }
    </style>
  </head>
  <body>
    <img src="banner.png" alt="Banner" class="banner">
    <div class="image-container">
      <img src="lol0001.jpg" alt="Default image">
      <img src="lol0002.jpg" alt="Zone 1 hover" class="hover" data-zone="1">
      <img src="lol0003.jpg" alt="Zone 2 hover" class="hover" data-zone="2">
      <img src="lol0004.jpg" alt="Zone 3 hover" class="hover" data-zone="3">
      <img src="lol0005.jpg" alt="Zone 4 hover" class="hover" data-zone="4">
      <img src="lol0006.jpg" alt="Zone 5 hover" class="hover" data-zone="5">
      <img src="lol0007.jpg" alt="Zone 6 hover" class="hover" data-zone="6">
      <div class="hover-zone zone1" data-zone="1"></div>
      <div class="hover-zone zone2" data-zone="2"></div>
      <div class="hover-zone zone3" data-zone="3"></div>
      <div class="hover-zone zone4" data-zone="4"></div>
      <div class="hover-zone zone5" data-zone="5"></div>
      <div class="hover-zone zone6" data-zone="6"></div>
    </div>

    <script>
      const zones = document.querySelectorAll('.hover-zone');

      // Map zone IDs to URLs — replace these with your actual links
      const zoneLinks = {
        '1': 'https://urlbug.love/portfolio',
        '2': 'https://ko-fi.com/urlbug',
        '3': 'https://urlbug.love/bio',
        '4': 'https://urlbug.love/blog',
        '5': 'https://urlbug.love/chat',
        '6': 'https://urlbug.love/bots',
      };

      let activeZoneId = null; // tracks which zone was first-tapped on mobile

      zones.forEach(zone => {
        const zoneId = zone.dataset.zone;
        const matchingImage = document.querySelector(`img.hover[data-zone="${zoneId}"]`);

        // Desktop: hover to show image, click to navigate
        zone.addEventListener('mouseenter', () => matchingImage.classList.add('active'));
        zone.addEventListener('mouseleave', () => matchingImage.classList.remove('active'));
        zone.addEventListener('click', () => {
          window.open(zoneLinks[zoneId], '_self');
        });

        // Mobile: first tap shows image, second tap on same zone navigates
        zone.addEventListener('touchstart', (e) => {
          e.preventDefault();

          if (activeZoneId === zoneId) {
            // Second tap on the same zone — navigate
            window.open(zoneLinks[zoneId], '_self');
            activeZoneId = null;
          } else {
            // First tap — show image
            document.querySelectorAll('img.hover.active').forEach(img => img.classList.remove('active'));
            matchingImage.classList.add('active');
            activeZoneId = zoneId;
          }
        }, { passive: false });
      });

      document.addEventListener('touchstart', (e) => {
        if (!e.target.classList.contains('hover-zone')) {
          document.querySelectorAll('img.hover.active').forEach(img => img.classList.remove('active'));
          activeZoneId = null;
        }
      });
    </script>
  </body>
</html>
