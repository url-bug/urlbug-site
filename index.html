<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        overflow-x: clip;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #ffffff;
        overflow-x: clip;
      }
      .image-container {
        position: relative;
        width: 50vw;
      }
      @media (max-width: 1400px) {
        .image-container {
          width: 200vw;
          margin-top: -15vh;
        }
      }
      .image-container img {
        width: 100%;
        height: auto;
        display: block;
      }
      .image-container img.hover {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: auto;
        opacity: 0;
        transition: opacity 0.0s ease;
        pointer-events: none;
      }
      .image-container img.hover.active {
        opacity: 1;
      }
      .hover-zone {
        position: absolute;
        cursor: pointer;
      }
      .zone1 { top: 17%; left: 14%; width: 26%; height: 20%; }
      .zone2 { top: 17%; left: 54%; width: 26%; height: 20%; }
      .zone3 { top: 43%; left: 14%; width: 26%; height: 20%; }
      .zone4 { top: 43%; left: 54%; width: 26%; height: 20%; }
      .zone5 { top: 68%; left: 14%; width: 26%; height: 20%; }
      .zone6 { top: 68%; left: 54%; width: 26%; height: 20%; }
    </style>
  </head>
  <body>
    <div class="image-container">
      <img src="lol0001.jpg" alt="Default image">
      <img src="lol0002.jpg" alt="Zone 1 hover" class="hover" data-zone="1">
      <img src="lol0003.jpg" alt="Zone 2 hover" class="hover" data-zone="2">
      <img src="lol0004.jpg" alt="Zone 3 hover" class="hover" data-zone="3">
      <img src="lol0005.jpg" alt="Zone 4 hover" class="hover" data-zone="4">
      <img src="lol0006.jpg" alt="Zone 5 hover" class="hover" data-zone="5">
      <img src="lol0007.jpg" alt="Zone 6 hover" class="hover" data-zone="6">
      <div class="hover-zone zone1" data-zone="1"></div>
      <div class="hover-zone zone2" data-zone="2"></div>
      <div class="hover-zone zone3" data-zone="3"></div>
      <div class="hover-zone zone4" data-zone="4"></div>
      <div class="hover-zone zone5" data-zone="5"></div>
      <div class="hover-zone zone6" data-zone="6"></div>
    </div>

    <script>
      const zones = document.querySelectorAll('.hover-zone');

      zones.forEach(zone => {
        const zoneId = zone.dataset.zone;
        const matchingImage = document.querySelector(`img.hover[data-zone="${zoneId}"]`);

        zone.addEventListener('mouseenter', () => matchingImage.classList.add('active'));
        zone.addEventListener('mouseleave', () => matchingImage.classList.remove('active'));

        zone.addEventListener('touchstart', (e) => {
          e.preventDefault();
          document.querySelectorAll('img.hover.active').forEach(img => img.classList.remove('active'));
          matchingImage.classList.add('active');
        }, { passive: false });
      });

      document.addEventListener('touchstart', (e) => {
        if (!e.target.classList.contains('hover-zone')) {
          document.querySelectorAll('img.hover.active').forEach(img => img.classList.remove('active'));
        }
      });
    </script>
  </body>
</html>
