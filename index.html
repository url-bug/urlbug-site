<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #ffffff;
      }

      /* Mobile first: image fills almost full screen */
      img {
        width: 95%;
        max-width: 95%;
        height: auto;
      }

      /* Desktop: image is 50% */
      @media (min-width: 768px) {
        img {
          width: 50%;
          max-width: 50%;
          height: auto;
        }
      }
    </style>
  </head>

  <body>
    <img src="lol0001.png" alt="My image">
  </body>
</html>
