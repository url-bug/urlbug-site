<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f5f5f5;
      }

      .image-container {
        position: relative;
        max-width: 50%;
      }

      /* Default image */
      .image-container img.default {
        width: 100%;
        height: auto;
        display: block;
      }

      /* Hover images (stacked) */
      .image-container img.hover {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: auto;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      /* Hover zones */
      .hover-zone {
        position: absolute;
        cursor: pointer;
      }

      /* Show the corresponding hover image */
      .zone1:hover ~ .hover1 { opacity: 1; }
      .zone2:hover ~ .hover2 { opacity: 1; }
      .zone3:hover ~ .hover3 { opacity: 1; }
      .zone4:hover ~ .hover4 { opacity: 1; }
      .zone5:hover ~ .hover5 { opacity: 1; }
      .zone6:hover ~ .hover6 { opacity: 1; }

      /* 3 rows x 2 columns */
      .zone1 { top: 0; left: 0; width: 50%; height: 33.33%; }
      .zone2 { top: 0; left: 50%; width: 50%; height: 33.33%; }

      .zone3 { top: 33.33%; left: 0; width: 50%; height: 33.33%; }
      .zone4 { top: 33.33%; left: 50%; width: 50%; height: 33.33%; }

      .zone5 { top: 66.66%; left: 0; width: 50%; height: 33.33%; }
      .zone6 { top: 66.66%; left: 50%; width: 50%; height: 33.33%; }
    </style>
  </head>

  <body>
    <div class="image-container">
      <!-- Default image -->
      <img src="photo.jpg" alt="Default image" class="default">

      <!-- Hover images for each zone -->
      <img src="lol0002.png" alt="Hover 1" class="hover hover1">
      <img src="lol0003.png" alt="Hover 2" class="hover hover2">
      <img src="lol0004.png" alt="Hover 3" class="hover hover3">
      <img src="lol0005.png" alt="Hover 4" class="hover hover4">
      <img src="lol0006.png" alt="Hover 5" class="hover hover5">
      <img src="lol0007.png" alt="Hover 6" class="hover hover6">

      <!-- Hover zones -->
      <div class="hover-zone zone1"></div>
      <div class="hover-zone zone2"></div>
      <div class="hover-zone zone3"></div>
      <div class="hover-zone zone4"></div>
      <div class="hover-zone zone5"></div>
      <div class="hover-zone zone6"></div>
    </div>
  </body>
</html>
