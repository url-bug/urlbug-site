<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #ffffff;
      }
      .image-container {
        position: relative;
        width: 90vw;
        max-width: 600px;
      }
      .image-container img {
        width: 100%;
        height: auto;
        display: block;
      }
      .image-container img.hover {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: auto;
        opacity: 0;
        transition: opacity 0.0s ease;
        pointer-events: none;
      }
      .image-container img.hover.active {
        opacity: 1;
      }
      .hover-zone {
        position: absolute;
        cursor: pointer;
        /* Uncomment below to debug zone positions: */
        /* background: rgba(255,0,0,0.2); border: 1px solid red; */
      }
      /*
        Cabinet spans roughly:
          horizontally: 33% to 80% of image width
          vertically:   43% to 93% of image height
        Split into 2 cols and 3 rows.
      */
      .zone1 { top: 43%;   left: 33%;   width: 22%; height: 16.7%; } /* top-left     */
      .zone2 { top: 43%;   left: 50%;   width: 22%; height: 16.7%; } /* top-right    */
      .zone3 { top: 59.7%; left: 33%;   width: 22%; height: 16.7%; } /* middle-left  */
      .zone4 { top: 59.7%; left: 50%;   width: 22%; height: 16.7%; } /* middle-right */
      .zone5 { top: 76.3%; left: 33%;   width: 22%; height: 16.7%; } /* bottom-left  */
      .zone6 { top: 76.3%; left: 50%;   width: 22%; height: 16.7%; } /* bottom-right */
    </style>
  </head>
  <body>
    <div class="image-container">
      <!-- Default image -->
      <img src="lol0001.png" alt="Default image">

      <!-- One hover image per zone — update src filenames as needed -->
      <img src="lol0002.png" alt="Zone 1 hover" class="hover" data-zone="1">
      <img src="lol0003.png" alt="Zone 2 hover" class="hover" data-zone="2">
      <img src="lol0004.png" alt="Zone 3 hover" class="hover" data-zone="3">
      <img src="lol0005.png" alt="Zone 4 hover" class="hover" data-zone="4">
      <img src="lol0006.png" alt="Zone 5 hover" class="hover" data-zone="5">
      <img src="lol0007.png" alt="Zone 6 hover" class="hover" data-zone="6">

      <!-- Hover zones (also handle touch for mobile) -->
      <div class="hover-zone zone1" data-zone="1"></div>
      <div class="hover-zone zone2" data-zone="2"></div>
      <div class="hover-zone zone3" data-zone="3"></div>
      <div class="hover-zone zone4" data-zone="4"></div>
      <div class="hover-zone zone5" data-zone="5"></div>
      <div class="hover-zone zone6" data-zone="6"></div>
    </div>

    <script>
      const zones = document.querySelectorAll('.hover-zone');

      zones.forEach(zone => {
        const zoneId = zone.dataset.zone;
        const matchingImage = document.querySelector(`img.hover[data-zone="${zoneId}"]`);

        // Mouse events (desktop)
        zone.addEventListener('mouseenter', () => {
          matchingImage.classList.add('active');
        });
        zone.addEventListener('mouseleave', () => {
          matchingImage.classList.remove('active');
        });

        // Touch events (mobile)
        zone.addEventListener('touchstart', (e) => {
          e.preventDefault();
          // Clear all other active hover images first
          document.querySelectorAll('img.hover.active').forEach(img => img.classList.remove('active'));
          matchingImage.classList.add('active');
        }, { passive: false });
      });

      // Tap anywhere outside a zone to reset on mobile
      document.addEventListener('touchstart', (e) => {
        if (!e.target.classList.contains('hover-zone')) {
          document.querySelectorAll('img.hover.active').forEach(img => img.classList.remove('active'));
        }
      });
    </script>
  </body>
</html>
