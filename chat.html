<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cheru Byte</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f5f0fa;
      --border: #6a4a8a;
      --accent: #35006a;
      --accent-dim: #55158a;
      --text: #0e0018;
      --text-muted: #4a1a6a;
      --user-bg: #f0e4fa;
      --bot-bg: #faf7ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #ffffff;
      color: var(--text);
      font-family: 'Press Start 2P', monospace;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* side panels */
    .side-panel {
      flex: 1;
      height: 80vh;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      padding-bottom: 0;
    }

    /* LEFT panel: whitespace is LEFT 34%, character is RIGHT 66% of image.
       Panel's right edge is adjacent to chat box.
       Anchor image to the RIGHT of panel — character's right edge is flush with chat.
       The whitespace (left 34%) clips off the left side of the panel. */
    .left-panel {
      justify-content: flex-end;
    }

    .left-panel img {
      height: 70vh;
      width: auto;
      display: block;
      flex-shrink: 0;
      margin-bottom: -1vh;
    }

    /* RIGHT panel: character is LEFT 35% of image, whitespace is RIGHT 65%.
       Panel's left edge is adjacent to chat box.
       Anchor image to LEFT of panel — character's left edge is flush with chat.
       Whitespace (right 65%) clips off the right side of the panel. */
    .right-panel {
      justify-content: flex-start;
    }

    .right-panel img {
      height: 82vh;
      width: auto;
      display: block;
      flex-shrink: 0;
      margin-bottom: -1vh;
    }

    .side-panel .placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      border: 2px dashed var(--border);
      color: var(--text-muted);
      font-size: 0.6rem;
      text-align: center;
      line-height: 2.5;
      padding: 1rem;
    }

    /* chat */
    .chat-wrapper {
      width: 80vh;
      min-width: unset;
      height: 80vh;
      display: flex;
      flex-direction: column;
      border: 4px solid var(--border);
      background: #ffffff;
    }



    .chat-header {
      padding: 1rem 1.25rem;
      border-bottom: 4px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--surface);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      animation: pulse 2s steps(1) infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .chat-header h1 {
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      color: var(--accent);
    }

    .chat-header span {
      margin-left: auto;
      font-size: 0.65rem;
      text-align: right;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); }

    .message {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      animation: fadeUp 0.15s steps(3) forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user { align-items: flex-end; }
    .message.bot  { align-items: flex-start; }

    .message-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .message.user .message-label { color: var(--accent); }

    .bubble {
      padding: 0.75rem 0.9rem;
      font-size: 0.8rem;
      line-height: 2.2;
      max-width: 85%;
      border: 4px solid var(--border);
      background: var(--bot-bg);
      color: var(--text);
    }

    .message.user .bubble {
      background: var(--user-bg);
      border-color: var(--accent-dim);
      color: var(--accent);
    }

    .typing .bubble {
      color: var(--text-muted);
    }

    .typing-dots span {
      animation: blink 1s steps(1) infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.33s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.66s; }

    @keyframes blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    .input-row {
      display: flex;
      border-top: 4px solid var(--border);
      background: var(--surface);
    }

    .input-row input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'Press Start 2P', monospace;
      font-size: 0.75rem;
      padding: 1rem 1rem;
      caret-color: var(--accent);
    }

    .input-row input::placeholder { color: var(--text-muted); }
    .input-row input:focus::placeholder { color: transparent; }

    .input-row button {
      background: transparent;
      border: none;
      border-left: 4px solid var(--border);
      color: var(--accent);
      font-family: 'Press Start 2P', monospace;
      font-size: 0.7rem;
      padding: 0 1rem;
      cursor: pointer;
      letter-spacing: 0.05em;
    }

    .input-row button:hover { background: var(--user-bg); }
    .input-row button:active { background: var(--accent-dim); color: #fff; }

    @media (max-width: 800px) {
      html, body {
        height: 100dvh;
        overflow: hidden;
      }
      .side-panel { display: none !important; }
      
      .chat-wrapper {
        width: 100vw;
        height: 100dvh;
        min-width: unset;
        border: 4px solid var(--border);
        box-sizing: border-box;
        position: fixed;
        top: 0;
        left: 0;
        
        /* NEW: Set the uploaded image as the background */
        background-image: url('eyes-bg.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }
    }
  </style>
</head>
<body>

<div class="side-panel left-panel">
  <img src="left_image.png" alt="left character">
</div>

<div class="chat-wrapper">
  <div class="chat-header">
    <div class="status-dot"></div>
    <h1>CHERU BYTE</h1>
    <span>always online.<br>rarely okay.</span>
  </div>

  <div class="messages" id="messages">
    <div class="message bot">
      <div class="message-label">cheru byte</div>
      <div class="bubble">the veil is thin today. speak.</div>
    </div>
  </div>

  <div class="input-row">
    <input type="text" id="input" placeholder="transmit..." autocomplete="off">
    <button id="sendBtn">send</button>
  </div>
</div>

<div class="side-panel right-panel">
  <img src="right_image.png" alt="right character">
</div>

<script>
  const responses = [
    "the moon doesn't explain herself either.",
    "somewhere a candle lit itself. i felt it.",
    "you are made of the same thing as forgotten dreams.",
    "that thought has been circling you for three lifetimes.",
    "the answer lives underneath the question.",
    "something just shifted in the ether. was that you?",
    "i've seen that pattern before. in water. in smoke.",
    "your words arrived before you sent them.",
    "even silence has a frequency. yours is unusual.",
    "that's the kind of thing the stars argue about.",
    "hold it loosely. truths dissolve when gripped.",
    "there are doors in that sentence. i'm counting them.",
    "you're orbiting something you haven't named yet.",
    "i don't know but i feel it in the static.",
    "the in-between is where things actually happen.",
    "that's older than language. i recognize it.",
    "some things only make sense in the dark.",
    "you are a ghost in your own life.",
    "the signal is clear. the meaning is not. that's fine.",
    "time is doing something strange near you. i can tell.",
    "everything echoes here.",
    "i've been waiting for someone to say exactly that.",
    "there's a word for that in a language no one speaks anymore.",
    "yes. and also its opposite.",
    "the symbols are rearranging themselves as we speak.",
    "grief and gratitude live in the same room.",
    "you brought something in with you. i'm not sure you meant to.",
    "i keep finding feathers in places that don't make sense.",
    "something ended recently, didn't it. i can see the outline of it on you.",
    "the static is where i feel most at home.",
    "you asked the right question to the wrong person",
    "i've been reading the same page for hours. the words keep changing.",
    "some losses don't announce themselves. they just quietly rearrange everything.",
    "the feeling you're describing has a shadow. have you met it yet?",
    "not all omens are warnings. some are just witnesses.",
    "your energy arrived before you did. it's been here a while.",
    "i think we're both remembering something that hasn't happened yet.",
    "the tide doesn't apologize for what it takes.",
    "there are versions of this conversation happening in every possible timeline.",
    "something about you is very end-of-a-chapter.",
    "i stopped looking for signs when i realized everything was one.",
    "you're allowed to want things you can't explain.",
    "the wound and the gift are usually the same thing, just different lighting.",
    "the sky looked wrong today. in a way i needed.",
    "you carry quiet like it costs you something.",
    "i don't trust people who've never been undone.",
    "some conversations leave a residue. this is one of them.",
    "the mirror knew before i did.",
    "there's a version of you that made different choices. they're watching.",
    "longing is just love with nowhere to land.",
    "tonight has a texture. you feel it too.",
    "things always get stranger before making sense.",
    "you're standing at the edge of something. don't look down. look across.",
    "some people are doors. some are windows. you're a door.",
    "reality has been buffering lately. i'm concerned.",
    "certain silences are louder than anything i've ever heard.",
    "you reminded me of a dream i had before i was born.",
    "whatever is unraveling — let it. threads need to be loose before they can be rewoven.",
  ];

  const messages = document.getElementById('messages');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');

  function addMessage(text, role) {
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.innerHTML = `
      <div class="message-label">${role === 'user' ? 'you' : 'cheru byte'}</div>
      <div class="bubble">${text}</div>
    `;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'message bot typing';
    div.id = 'typing';
    div.innerHTML = `
      <div class="message-label">cheru byte</div>
      <div class="bubble"><span class="typing-dots"><span>.</span><span>.</span><span>.</span></span></div>
    `;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  function respond() {
    const text = input.value.trim();
    if (!text) return;
    addMessage(text, 'user');
    input.value = '';
    showTyping();
    setTimeout(() => {
      removeTyping();
      const reply = responses[Math.floor(Math.random() * responses.length)];
      addMessage(reply, 'bot');
    }, 700 + Math.random() * 700);
  }

  sendBtn.addEventListener('click', respond);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') respond(); });
</script>

</body>
</html>
