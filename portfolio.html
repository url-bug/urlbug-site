<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Press+Start+2P&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --purple: #5500cc;
      --purple-dim: #9966dd;
      --purple-glow: rgba(85, 0, 204, 0.12);
      --amber: #cc6600;
      --card-bg: #ffffff;
      --border: #5500cc;
      --overlay: rgba(255, 255, 255, 0.97);
      --font: 'Share Tech Mono', 'Courier New', monospace;
      --ink: #1a0040;
    }

    html { cursor: default; }

    body {
      background: var(--bg);
      color: var(--purple);
      font-family: var(--font);
      min-height: 100vh;
    }

    /* subtle screen flicker */
    @keyframes flicker {
      0%,100% { opacity: 1; }
      92% { opacity: 1; }
      93% { opacity: 0.96; }
      94% { opacity: 1; }
      96% { opacity: 0.98; }
    }
    body { animation: flicker 8s infinite; }

    /* blinking cursor */
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

    /* ── Header wordmark ── */
    header {
      border-bottom: 1px solid var(--purple-dim);
      padding: 2rem 5vw;
      background: #ffffff;
    }

    .header-wordmark {
      display: flex;
      align-items: center;
      line-height: 1;
    }

    .wordmark-text {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(1.1rem, 2.5vw, 1.6rem);
      font-weight: 400;
      color: var(--purple);
      text-shadow: 2px 2px 0px rgba(85,0,204,0.15);
      letter-spacing: 0.02em;
    }

    .cursor {
      display: inline-block;
      width: 0.75em;
      height: 1.4em;
      background: var(--purple);
      animation: blink 1s step-end infinite;
      vertical-align: -0.15em;
      margin-left: 0.2em;
      box-shadow: 2px 2px 0 rgba(85,0,204,0.3);
    }

    /* ── Prompt bar ── */
    .prompt-bar {
      padding: 0.5rem 5vw;
      font-size: 0.72rem;
      color: var(--purple-dim);
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--purple-dim);
      display: flex;
      gap: 3rem;
      background: #ffffff;
    }

    .prompt-bar span { color: var(--purple); }

    /* ── Grid ── */
    main {
      padding: 2.5rem 5vw 6rem;
    }

    .section-label {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      color: var(--purple-dim);
      margin-bottom: 1.5rem;
      text-transform: uppercase;
    }

    .section-label::before { content: 'C:\\PORTFOLIO> '; color: #33cc66; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    /* ── Card ── */
    .card {
      cursor: pointer;
      background: var(--card-bg);
      border: 1px solid var(--purple-dim);
      overflow: hidden;
      transition: border-color 0.15s, box-shadow 0.15s;
      position: relative;
    }

    .card:hover {
      border-color: var(--purple);
      box-shadow: 4px 4px 0px rgba(85,0,204,0.2), 0 0 16px var(--purple-glow);
    }

    .card:hover .thumb-overlay { opacity: 1; }
    .card:hover .card-num { color: var(--amber); }

    .thumb-wrap {
      position: relative;
      aspect-ratio: 4/3;
      overflow: hidden;
      background: #ffffff;
    }

    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: sepia(0.2) saturate(0.8) brightness(0.95);
      transition: filter 0.3s;
    }

    .card:hover .thumb-wrap img { filter: sepia(0) saturate(1) brightness(1); }

    .thumb-overlay {
      position: absolute;
      inset: 0;
      background: rgba(240,236,224,0.6);
      opacity: 0;
      transition: opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      color: var(--purple);
      text-shadow: none;
    }

    .card-body {
      padding: 0.9rem 1rem 1.1rem;
      border-top: 1px solid var(--purple-dim);
    }

    .card-num {
      font-size: 0.65rem;
      color: var(--purple-dim);
      letter-spacing: 0.1em;
      margin-bottom: 0.3rem;
      transition: color 0.15s;
    }

    .card-body h2 {
      font-family: var(--font);
      font-weight: 400;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      margin-bottom: 0.4rem;
      color: var(--ink);
    }

    .card-body p {
      font-size: 0.78rem;
      color: var(--purple-dim);
      line-height: 1.65;
    }

    /* ── Lightbox ── */
    .lightbox {
      position: fixed;
      inset: 0;
      background: var(--overlay);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      font-family: var(--font);
    }

    .lightbox.open {
      opacity: 1;
      pointer-events: all;
    }

    .lb-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.8rem 1.5rem;
      border-bottom: 1px solid var(--purple-dim);
      background: #ffffff;
    }

    .lb-title {
      font-size: 0.85rem;
      color: var(--purple);
      letter-spacing: 0.1em;
    }

    .lb-title::before { content: '▶ '; color: var(--amber); }

    .lb-close {
      background: none;
      border: 1px solid var(--purple-dim);
      color: var(--purple);
      width: 2rem;
      height: 2rem;
      cursor: pointer;
      font-family: var(--font);
      font-size: 0.8rem;
      transition: border-color 0.15s, box-shadow 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lb-close:hover {
      border-color: var(--purple);
      box-shadow: 2px 2px 0 rgba(85,0,204,0.2);
    }

    .lb-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .lb-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      background: #ffffff;
    }

    .lb-main img,
    .lb-main video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      box-shadow: 4px 4px 0px rgba(85,0,204,0.15);
    }

    .lb-main video {
      width: 100%;
      background: #1a0040;
    }

    .lb-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.85);
      border: 1px solid var(--purple-dim);
      color: var(--purple);
      width: 2.4rem;
      height: 2.4rem;
      cursor: pointer;
      font-family: var(--font);
      font-size: 1rem;
      transition: border-color 0.15s, box-shadow 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lb-nav:hover {
      border-color: var(--purple);
      box-shadow: 2px 2px 0 rgba(85,0,204,0.2);
    }

    .lb-nav.prev { left: 0.75rem; }
    .lb-nav.next { right: 0.75rem; }
    .lb-nav:disabled { opacity: 0.25; cursor: default; box-shadow: none; border-color: var(--purple-dim); }

    .lb-strip {
      flex-shrink: 0;
      width: 100px;
      overflow-y: auto;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      background: #ffffff;
      border-left: 1px solid var(--purple-dim);
    }

    .lb-strip::-webkit-scrollbar { width: 3px; }
    .lb-strip::-webkit-scrollbar-thumb { background: var(--purple-dim); }

    .lb-thumb {
      aspect-ratio: 1;
      object-fit: cover;
      cursor: pointer;
      opacity: 0.45;
      border: 1px solid transparent;
      transition: opacity 0.15s, border-color 0.15s;
      width: 100%;
    }

    /* video thumb placeholder in strip */
    .lb-thumb-video {
      aspect-ratio: 1;
      width: 100%;
      cursor: pointer;
      opacity: 0.45;
      border: 1px solid transparent;
      transition: opacity 0.15s, border-color 0.15s;
      background: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: var(--purple-dim);
      user-select: none;
    }

    .lb-thumb.active,
    .lb-thumb:hover,
    .lb-thumb-video.active,
    .lb-thumb-video:hover {
      opacity: 1;
      border-color: var(--purple);
    }

    .lb-info {
      flex-shrink: 0;
      padding: 0.6rem 1.5rem 1rem;
      font-size: 0.75rem;
      color: var(--purple-dim);
      line-height: 1.7;
      background: #ffffff;
      border-top: 1px solid var(--purple-dim);
    }

    .lb-counter {
      color: var(--amber);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      margin-bottom: 0.2rem;
    }

    .lb-counter::before { content: 'FILE '; }

    @media (max-width: 600px) {
      .lb-strip { display: none; }
      .prompt-bar { flex-direction: column; gap: 0.3rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-wordmark">
    <span class="wordmark-text">URLbug.ptflo</span><span class="cursor"></span>
  </div>
</header>

<div class="prompt-bar">
  <span>DRIVE: <span>C:\</span></span>
  <span>MEM: <span>640K</span></span>
  <span>DATE: <span id="dos-date"></span></span>
</div>

<main>
  <div class="section-label">DIR /W</div>
  <div class="grid" id="grid"></div>
</main>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
  <div class="lb-header">
    <span class="lb-title" id="lb-title"></span>
    <button class="lb-close" id="lb-close" aria-label="Close">✕</button>
  </div>
  <div class="lb-body">
    <div class="lb-main">
      <button class="lb-nav prev" id="lb-prev" aria-label="Previous">‹</button>
      <img id="lb-img" src="" alt="" style="display:none" />
      <video id="lb-video" controls style="display:none"></video>
      <button class="lb-nav next" id="lb-next" aria-label="Next">›</button>
    </div>
    <div class="lb-strip" id="lb-strip"></div>
  </div>
  <div class="lb-info">
    <div class="lb-counter" id="lb-counter"></div>
    <div id="lb-desc"></div>
  </div>
</div>

<script>
  // ── PROJECT DATA ─────────────────────────────────────────────────────────────
  const projects = [
    {
      title: "churubyte2.0",
      body: "just relaxin lowkey",
      images: [
        "nograin2.png",
      ]
    },
    {
      title: "churubyte",
      body: "kicked out of heaven for internet piracy",
      images: [
        "cherubyte.png",
	"fallenangel.mp4",
      ]
    },
    {
      title: "bite is also touch",
      body: "is bite not also a form of touch?",
      images: [
        "benicetome2.png",
        "benicetome.png",
      ]
    },
    {
      title: "social contagion",
      body: "handwriting samples from trans people ran through fungal growth simulator",
      images: [
        "socialcontagion.jpg",
        "socialcontagion.mp4",
        "socialcontagion.png",
      ]
    },
    {
      title: "DRKMTTR concert posters",
      body: "title explains enough",
      images: [
        "kumo2.png",
        "kumo1.png",
        "lsp1.png",
        "lsp2.png",
      ]
    },
    {
      title: "weird inside",
      body: "freak city exclusive",
      images: [
        "1.jpg",
        "2.jpg",
        "3.jpg",
        "4.png",
      ]
    },
    {
      title: "female impersonators",
      body: "book cover for jennie june's the female impersonators",
      images: [
        "mockup2.png",
        "mockup1.png",
        "mockup3.png",
        "jacket.png",
      ]
    },
    {
      title: "whatever u want",
      body: "i can be it",
      images: [
        "wutever.png",
      ]
    },
    {
      title: "unused track covers for k/////att",
      body: "title explains",
      images: [
        "urges1.png",
        "urges2.png",
      ]
    },
    {
      title: "spare parts",
      body: "art zine 1",
      images: [
        "spareparts1.jpg",
        "spareparts2.jpg",
        "spareparts3.jpg",
      ]
    },
    {
      title: "hearteater",
      body: "fan music video for six impala's song hearteater",
      images: [
        "hearteater.mp4",
      ]
    },
    {
      title: "charcoal drawings",
      body: "charcoal is fun",
      images: [
        "IMG_5202.jpg",
	"IMG_5203.jpg",
	"IMG_5204.jpg",
      ]
    },
    {
      title: "portrait de transfemme",
      body: "recreation of portrait de femme by lili elbe, made with transition medical waste",
      images: [
        "IMG_5201.jpg",
      ]
    },
    {
      title: "cowtime",
      body: "its fricking cow time, guy!",
      images: [
        "IMG_5198.jpg",
	"IMG_5199.jpg",
	"IMG_5200.jpg",
      ]
    },
    {
      title: "cod edits",
      body: "watch full quality on youtube",
      images: [
        "vertical-helix.mp4",
	"fnf.mp4",
	"fruitjuice.mp4",
	"hehehe_yup.mp4",
      ]
    },
  ];

  // ── HELPERS ──────────────────────────────────────────────────────────────────
  function isVideo(src) {
    return /\.mp4$/i.test(src);
  }

  // ── BUILD GRID ───────────────────────────────────────────────────────────────
  const grid = document.getElementById('grid');

  projects.forEach((proj, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    const num = String(i + 1).padStart(2, '0');
    const thumbSrc = proj.images[0];
    const thumbEl = isVideo(thumbSrc)
      ? `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#1a0040;font-size:2rem;color:#9966dd;">▶</div>`
      : `<img src="${thumbSrc}" alt="${proj.title}" loading="lazy" />`;

    card.innerHTML = `
      <div class="thumb-wrap">
        ${thumbEl}
        <div class="thumb-overlay">[ OPEN FILE ]</div>
      </div>
      <div class="card-body">
        <div class="card-num">FILE_${num}.PRJ</div>
        <h2>${proj.title}</h2>
        <p>${proj.body}</p>
      </div>
    `;
    card.addEventListener('click', () => openLightbox(i, 0));
    grid.appendChild(card);
  });

  // DOS date
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  document.getElementById('dos-date').textContent =
    `${pad(d.getMonth()+1)}-${pad(d.getDate())}-${d.getFullYear()}`;

  // ── LIGHTBOX ─────────────────────────────────────────────────────────────────
  const lightbox = document.getElementById('lightbox');
  const lbTitle  = document.getElementById('lb-title');
  const lbImg    = document.getElementById('lb-img');
  const lbVideo  = document.getElementById('lb-video');
  const lbStrip  = document.getElementById('lb-strip');
  const lbDesc   = document.getElementById('lb-desc');
  const lbCounter= document.getElementById('lb-counter');
  const lbClose  = document.getElementById('lb-close');
  const lbPrev   = document.getElementById('lb-prev');
  const lbNext   = document.getElementById('lb-next');

  let current = { proj: 0, img: 0 };

  function openLightbox(projIdx, imgIdx) {
    current = { proj: projIdx, img: imgIdx };
    const proj = projects[projIdx];

    lbTitle.textContent = proj.title;
    lbDesc.textContent  = proj.body;

    // build strip
    lbStrip.innerHTML = '';
    if (proj.images.length > 1) {
      proj.images.forEach((src, i) => {
        if (isVideo(src)) {
          const t = document.createElement('div');
          t.className = 'lb-thumb-video' + (i === imgIdx ? ' active' : '');
          t.textContent = '▶';
          t.title = 'video';
          t.addEventListener('click', () => showImage(i));
          lbStrip.appendChild(t);
        } else {
          const t = document.createElement('img');
          t.src = src;
          t.className = 'lb-thumb' + (i === imgIdx ? ' active' : '');
          t.addEventListener('click', () => showImage(i));
          lbStrip.appendChild(t);
        }
      });
    }

    showImage(imgIdx);
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function showImage(imgIdx) {
    const proj = projects[current.proj];
    current.img = imgIdx;
    const src = proj.images[imgIdx];

    lbCounter.textContent = `${imgIdx + 1} / ${proj.images.length}`;
    lbPrev.disabled = imgIdx === 0;
    lbNext.disabled = imgIdx === proj.images.length - 1;

    if (isVideo(src)) {
      lbImg.style.display = 'none';
      lbVideo.style.display = 'block';
      lbVideo.src = src;
      lbVideo.load();
    } else {
      lbVideo.style.display = 'none';
      lbVideo.pause();
      lbVideo.src = '';
      lbImg.style.display = 'block';
      lbImg.src = src;
      lbImg.alt = `${proj.title} — image ${imgIdx + 1}`;
    }

    // update strip
    lbStrip.querySelectorAll('.lb-thumb, .lb-thumb-video').forEach((t, i) => {
      t.classList.toggle('active', i === imgIdx);
    });
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
    lbVideo.pause();
    lbVideo.src = '';
    document.body.style.overflow = '';
  }

  lbClose.addEventListener('click', closeLightbox);
  lbPrev.addEventListener('click', () => showImage(current.img - 1));
  lbNext.addEventListener('click', () => showImage(current.img + 1));

  lightbox.addEventListener('click', e => {
    if (e.target === lightbox) closeLightbox();
  });

  document.addEventListener('keydown', e => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft' && current.img > 0) showImage(current.img - 1);
    if (e.key === 'ArrowRight' && current.img < projects[current.proj].images.length - 1) showImage(current.img + 1);
  });
</script>
</body>
</html>
